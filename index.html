<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<script>try{var t=JSON.parse(localStorage.getItem('cl2-theme'));if(t==='light'||t==='dark')document.documentElement.setAttribute('data-theme',t)}catch(e){}</script>
<style>
:root{--bg:#0e1015;--s1:#13161d;--ln:#232836;--ctl:#4b5470;--tx:#e8eaf0;--mu:#9aa2b5;--ac:#8ab4ff;--btn:#3b5bdb;--bad:#ef7b78}
:root[data-theme=light]{--bg:#fff;--s1:#f4f5f7;--ln:#d5d8de;--ctl:#a9afbb;--tx:#111;--mu:#555;--ac:#1d4ed8;--btn:#1d4ed8;--bad:#b91c1c}
@media (prefers-color-scheme:light){:root:not([data-theme=dark]){--bg:#fff;--s1:#f4f5f7;--ln:#d5d8de;--ctl:#a9afbb;--tx:#111;--mu:#555;--ac:#1d4ed8;--btn:#1d4ed8;--bad:#b91c1c}}
*{box-sizing:border-box}html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;align-items:center;justify-content:center;padding:16px}
form{width:100%;max-width:360px;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:24px}
h1{font-size:20px;margin:0 0 4px}p{margin:0 0 16px;color:var(--mu);font-size:13px}
input[type=password]{width:100%;font:inherit;font-size:16px;color:var(--tx);background:var(--bg);border:1px solid var(--ctl);border-radius:8px;padding:10px 12px}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
label{display:flex;gap:8px;align-items:center;margin:12px 0 16px;font-size:13px;color:var(--mu)}
button{width:100%;font:inherit;font-weight:600;color:#fff;background:var(--btn);border:0;border-radius:8px;padding:10px;cursor:pointer}
button[disabled]{opacity:.6;cursor:wait}
.err{color:var(--bad);font-size:13px;min-height:20px;margin:8px 0 0}
</style></head><body>
<form id="f" autocomplete="on"><h1>Sign in</h1><p>Private reference. Enter your passphrase.</p>
<input type="text" name="username" value="cs" autocomplete="username" hidden>
<input id="pw" type="password" name="password" autocomplete="current-password" aria-label="Passphrase" placeholder="Passphrase" required autofocus>
<label><input id="rm" type="checkbox"> Remember me on this device for 30 days</label>
<button id="go" type="submit">Open</button><div class="err" id="err" role="alert"></div></form>

<script>
(function () {
  var P = JSON.parse(document.getElementById('payload').textContent), S = crypto.subtle, RK = 'cs-env-key', DAY = 864e5;
  function ub(s) { var b = atob(s), u = new Uint8Array(b.length); for (var i = 0; i < b.length; i++) u[i] = b.charCodeAt(i); return u; }
  function bu(u) { var s = ''; for (var i = 0; i < u.length; i++) s += String.fromCharCode(u[i]); return btoa(s); }
  function store(v) { try { v ? localStorage.setItem(RK, JSON.stringify(v)) : localStorage.removeItem(RK); } catch (e) {} }
  function stored() { try { var v = JSON.parse(localStorage.getItem(RK)); return v && v.e > Date.now() && v.k ? v : null; } catch (e) { return null; } }
  function derive(pw) {
    return S.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveBits']).then(function (b) {
      return S.deriveBits({ name: 'PBKDF2', hash: 'SHA-256', salt: ub(P.s), iterations: P.n }, b, 256);
    }).then(function (bits) { return new Uint8Array(bits); });
  }
  function open(kekBytes) {
    return S.importKey('raw', kekBytes, 'AES-GCM', false, ['decrypt']).then(function (kek) {
      var i = 0;
      function next() {
        if (i >= P.k.length) return Promise.reject(new Error('no match'));
        var w = P.k[i++];
        return S.decrypt({ name: 'AES-GCM', iv: ub(w.i) }, kek, ub(w.w)).catch(next);
      }
      return next();
    }).then(function (ck) { return S.importKey('raw', ck, 'AES-GCM', false, ['decrypt']); })
      .then(function (key) { return S.decrypt({ name: 'AES-GCM', iv: ub(P.i) }, key, ub(P.c)); })
      .then(function (pt) { return new TextDecoder().decode(pt); });
  }
  function show(html) { document.open(); document.write(html); document.close(); }
  var f = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');
  if (!window.crypto || !S) { err.textContent = 'This browser cannot open the page. Use a current Safari, Chrome, Edge or Firefox over https.'; go.disabled = true; return; }
  var r = stored();
  if (r) { f.style.visibility = 'hidden'; var t = setTimeout(function () { f.style.visibility = ''; }, 8000); open(ub(r.k)).then(show, function () { clearTimeout(t); store(null); f.style.visibility = ''; }); }
  f.addEventListener('submit', function (e) {
